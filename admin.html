<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Issue Tracker - Administrator Workspace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">
  <header class="topbar">
    <a class="brand" href="admin.html">Campus Issue Tracker</a>
    <div class="topbar-right"><span class="role-pill">Administrator</span><span id="welcomeName" class="muted"></span><a class="button outline" href="profile.html">My Profile</a><button class="button outline" data-logout>Log out</button></div>
  </header>
  <main class="page-wrap">
    <section class="page-heading"><div><p class="eyebrow">Admin workspace</p><h1>Issue management</h1><p class="muted">Review student reports and update their progress.</p></div><button class="button outline" id="refreshIssues">Refresh reports</button></section>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <section class="stats-row" aria-label="Issue totals">
      <div class="stat-card"><span>Total reports</span><strong id="totalCount">0</strong></div>
      <div class="stat-card"><span>Reported</span><strong id="reportedCount">0</strong></div>
      <div class="stat-card"><span>In progress</span><strong id="progressCount">0</strong></div>
      <div class="stat-card"><span>Resolved</span><strong id="resolvedCount">0</strong></div>
    </section>
    <section class="panel"><h2>Student reports</h2><div id="issuesList" class="issue-list"><p class="muted">Loading issues…</p></div></section>
  </main>
  <script src="dashboard.js"></script>
</body>
</html>
